<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>
    <link rel="shortcut icon" href="./assets/icons/logo-burger.svg" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/fonts-and-headlines.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <div>
                <img src="./assets/icons/logo-bestellapp.svg" alt="Logo Bestellapp">
            </div>
            <nav>
                <img src="./assets/icons/ham-menu.svg" alt="ham-menu">
            </nav>
        </div>
    </header>
    <main>
        <section class="content-wrapper">
            <div class="content">
                <section class="hero">
                    <div class="hero-cover"></div>
                    <div class="burger-logo">
                        <img class="burger" src="./assets/icons/logo-burger.svg" alt="burger">
                        <div class="headline-container">
                            <div class="logo-with-reviews-container">
                                <h1><span>Burger</span>House</h1>
                                <div class="reviews">
                                    <img src="./assets/icons/star.svg" alt="star">
                                    <p><b>4,1 </b><span>(317)</span></p>
                                </div>
                            </div>
                            <p class="subhead">The best of Burgers, Pizza, and Greens, all in one great place.</p>
                        </div>
                    </div>
                </section>
            </div>
            <section class="basket-wrapper">
                <div class="basket">Warenkorb</div>
                
            </section>
        </section>
        
    </main>
</body>

</html>
