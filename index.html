<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestellApp</title>
    <link
      rel="shortcut icon"
      href="./assets/icons/favicon.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/fonts-and-headlines.css" />
    <link rel="stylesheet" href="./styles/foodcards.css" />
    <link rel="stylesheet" href="./styles/buttons.css" />
    <link rel="stylesheet" href="./styles/responsiv.css" />
  </head>

  <body onload="init()">
    <header class="header-global">
      <div class="header-inner">
        <img
          class="logo-header"
          src="./assets/icons/logo-bestellapp.svg"
          alt=""
        />
        <nav>
          <button class="burger">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </nav>
      </div>
    </header>
    <main>
      <section class="content-wrapper">
        <div class="content">
          <section class="hero">
            <div class="hero-cover">
              <div class="kuchen-logo">
                <img class="kuchen" src="./assets/imgs/cake.jpg" alt="Kuchen" />
              </div>
            </div>
            <div class="headline-container">
              <div class="logo-with-reviews-container">
                <h1><span>Kuchen</span>glück</h1>
                <div class="reviews">
                  <img src="./assets/icons/star.png" alt="star" />
                  <p><b>4,1 </b><span>(317)</span></p>
                </div>
              </div>
              <p class="headline">Lust auf etwas Süßes?</p>
            </div>
          </section>
          <section class="food-section">
            <div class="subhead-container">
              <div class="subhead-container-inner">
                <img
                  class="subhead-icon"
                  src="./assets/icons/kuchen.png"
                  alt="Kuchen"
                />
                <h2 class="subhead">Kuchen</h2>
              </div>
            </div>
            <div class="menu-cards" id="menuCardsCakesSection"></div>
          </section>
          <section class="food-section">
            <div class="subhead-container">
              <div class="subhead-container-inner">
                <img
                  class="subhead-icon"
                  src="./assets/icons/kaesekuchen.png"
                  alt="burger"
                />
                <h2 class="subhead">Käsekuchen</h2>
              </div>
            </div>
            <div class="menu-cards" id="menuCardsCheescakesSection"></div>
          </section>
          <section class="food-section">
            <div class="subhead-container">
              <div class="subhead-container-inner">
                <img
                  class="subhead-icon"
                  src="./assets/icons/donut.png"
                  alt="burger"
                />
                <h2 class="subhead">Donuts</h2>
              </div>
            </div>
            <div class="menu-cards" id="menuCardsDonutsSection"></div>
          </section>
          <section class="food-section">
            <div class="subhead-container">
              <div class="subhead-container-inner">
                <img
                  class="subhead-icon"
                  src="./assets/icons/muffin.png"
                  alt="burger"
                />
                <h2 class="subhead">Muffins</h2>
              </div>
            </div>
            <div class="menu-cards" id="menuCardsCupcakesSection"></div>
          </section>
        </div>
        <section class="basket-wrapper" id="basketWrapper">
          <div class="basket">
            <div class="basket-close-header">
              <h2>Warenkorb</h2>
              <button class="small-basket-button" onclick="showMobileBasket()">
                ✕
              </button>
            </div>
            <h2 class="desktop-basket-header">Warenkorb</h2>
            <div class="basket-content" id="basketContent"></div>
            <div class="basket-content" id="basketTotal"></div>
            <dialog class="dialog-mode" id="dialogMode" aria-labelledby="dialogTitel" aria-describedby="dialogDescription">
              <div class="dialog-mode-inner">
                <header>
                    <img class="dialog-img" src="./assets/icons/car-t.png" alt="Lieferauto">
                    <h2>Gute Wahl!</h2>
                </header>
                <section class="dialog-section">
                  <p>Deine Bestellung macht sich gerade auf den Weg</p>
                </section>
                <footer class="footer-dialog">
                  <button class="add-to-basket-button" onclick="closeDialog()">Schließen</button>
                </footer>
              </div>
            </dialog>
          </div>
        </section>
      </section>
      <footer class="footer-global">
        <p>© 2026 BestellApp</p>
        <a href="#">Impressum</a>
        <a href="#">Datenschutz und Cookies</a>
      </footer>
      <nav class="bottom-nav">
        <button>
          <img src="./assets/icons/home.png" alt="Home icon" />
        </button>
        <button>
          <img src="./assets/icons/person.png" alt="Person icon" />
        </button>
        <button>
          <img src="./assets/icons/takeout-dining.png" alt="Takout dinning" />
        </button>
        <button onclick="showMobileBasket()">
          <img src="./assets/icons/shopping-cart.png" alt="Schopping cart" />
          <span class="d-none basket-art-amount" id="basketArtAmount"></span>
        </button>
      </nav>
    </main>
    <script src="./scripts/datenbank.js"></script>
    <script src="./scripts/templates.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
