<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>
    <link rel="shortcut icon" href="./assets/icons/kaesekuchen-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/fonts-and-headlines.css">
    <link rel="stylesheet" href="./styles/foodcards.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <div>
                <p><span>Kuchen</span>glück</p>
            </div>
            <nav>
                <img src="./assets/icons/ham-menu.svg" alt="ham-menu">
            </nav>
        </div>
    </header>
    <main>
        <section class="content-wrapper">
            <div class="content">
                <section class="hero">
                    <div class="hero-cover">
                        <div class="kuchen-logo">
                            <img class="kuchen" src="./assets/imgs/cake.jpg" alt="Kuchen">
                        </div>
                    </div>
                    <div class="headline-container">
                        <div class="logo-with-reviews-container">
                            <h1><span>Kuchen</span>glück</h1>
                            <div class="reviews">
                                <img src="./assets/icons/star.png" alt="star">
                                <p><b>4,1 </b><span>(317)</span></p>
                            </div>
                        </div>
                        <p class="headline">Lust auf etwas Süßes?</p>
                    </div>
                </section>
                <section class="food-section">
                    <div class="subhead-container">
                        <img class="subhead-icon" src="./assets/icons/kuchen-icon.png" alt="Kuchen">
                        <h2 class="subhead">Kuchen</h2>
                    </div>
                    <div class="menu-cards">
                        <div class="food-card">
                            <img class="food-card-img" src="./assets/imgs/schokokuchen.jpg" alt="Schokoladenkuchen">
                            <div class="food-card-text-container">
                                <div class="food-card-title-with-price">
                                    <h3>Saftiger Schokoladenkuchen</h3>
                                    <p>4,50€</p>
                                </div>
                                <p>Extra saftiger Schoko-Genuss mit vollmundigem Aroma und einer feinen Schicht edler
                                    Zartbitter-Ganache</p>
                                <div class="food-card-buttons">
                                    <button>Hinzufügen</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>
                <section class="food-section">
                    <div class="subhead-container">
                        <img class="subhead-icon" src="./assets/icons/kaesekuchen-icon.png" alt="burger">
                        <h2 class="subhead">Käsekuchen</h2>
                    </div>
                    <div class="menu-cards"></div>
                </section>
                <section class="food-section">
                    <div class="subhead-container">
                        <img class="subhead-icon" src="./assets/icons/donut-icon.png" alt="burger">
                        <h2 class="subhead">Donuts</h2>
                        <div class="menu-cards"></div>
                    </div>
                </section>
                <section class="food-section">
                    <div class="subhead-container">
                        <img class="subhead-icon" src="./assets/icons/muffin-icon.png" alt="burger">
                        <h2 class="subhead">Muffins</h2>
                        <div class="menu-cards"></div>
                    </div>
                </section>
            </div>
            <section class="basket-wrapper">
                <div class="basket">Warenkorb</div>
            </section>
        </section>
        <footer>
            <p>© 2026 Kuchenglück</p>
        </footer>
    </main>
</body>

</html>
